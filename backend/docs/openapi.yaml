        '500':
          $ref: '#/components/responses/ServerError'

  /api/recipes/{recipe_id}/ingredients:
    parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1

    get:
      tags: [Recipe Ingredients]
      summary: Get ingredients for a recipe
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Recipe ingredients retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeIngredient'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/recipe-ingredients/{recipe_id}/{ingredient_id}:
    parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: ingredient_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1

    put:
      tags: [Recipe Ingredients]
      summary: Update ingredient quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: 200 g
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Quantity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeIngredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Recipe Ingredients]
      summary: Remove ingredient from recipe
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
