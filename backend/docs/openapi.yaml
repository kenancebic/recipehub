      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/Deleted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/meal-plans/{meal_plan_id}/items:
    parameters:
      - name: meal_plan_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1

    get:
      tags: [Meal Plan Items]
      summary: Get items for a meal plan
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Meal plan items retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealPlanItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # EXTERNAL API

  /api/external/meal-search:
    get:
      tags: [External API]
      summary: Search meals using TheMealDB
      description: Searches TheMealDB by meal name. The API key is stored in backend configuration and is not exposed to clients.
      parameters:
        - name: query
          in: query
          required: true
          description: Meal name to search for.
          schema:
            type: string
            minLength: 1
          example: chicken
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Meals retrieved successfully. Results may be empty when no meals match.
          content:
            application/json:
              schema:
                type: object
                required: [success, query, results]
                properties:
                  success:
                    type: boolean
                    example: true
                  query:
                    type: string
                    example: chicken
                  results:
                    type: array
                    items:
                      type: object
                      description: Meal object returned by TheMealDB.
                      properties:
                        idMeal:
                          type: string
                          example: "52795"
                        strMeal:
                          type: string
                          example: Chicken Handi
                        strCategory:
                          type: string
                          example: Chicken
                        strArea:
                          type: string
                          example: Indian
                        strInstructions:
                          type: string
                        strMealThumb:
                          type: string
                          format: uri
        '400':
          description: Search query is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: External recipe search failed or the provider returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: Authentication is required or the provided credentials are invalid. This response is part of the planned API contract; authentication checks must be implemented by the backend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: The authenticated user does not have permission to perform this operation. This response is part of the planned API contract; authorization checks must be implemented by the backend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Deleted:
      description: Resource deleted successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'

  schemas:

    Error:
      type: object
      properties:
        error:
          type: string
          example: Resource not found.

    Message:
      type: object
      properties:
        message:
          type: string
          example: Resource deleted successfully.

    NamedEntity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Breakfast

    NameInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Breakfast

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Smith
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          minLength: 8
          maxLength: 255
          description: Must contain at least one letter and one number.
          example: SecurePass123
        role:
          type: string
          enum: [user, admin]
          default: user

    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255
        role:
          type: string
          enum: [user, admin]

    Recipe:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        category_id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        instructions:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        prep_time:
          type: integer
        created_at:
          type: string
          format: date-time

    RecipeInput:
      type: object
      required:
        - user_id
        - category_id
        - title
        - instructions
        - difficulty
        - prep_time
      additionalProperties: false
      properties:
        user_id:
          type: integer
          minimum: 1
        category_id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
          nullable: true
        instructions:
          type: string
          minLength: 1
        difficulty:
          type: string
          enum: [easy, medium, hard]
        prep_time:
          type: integer
          minimum: 0

    RecipeIngredient:
      type: object
      properties:
        recipe_id:
          type: integer
        ingredient_id:
          type: integer
        quantity:
          type: string
          example: 200 g

    RecipeIngredientInput:
      type: object
      required: [recipe_id, ingredient_id, quantity]
      additionalProperties: false
      properties:
        recipe_id:
          type: integer
          minimum: 1
        ingredient_id:
          type: integer
          minimum: 1
        quantity:
          type: string
          minLength: 1
          maxLength: 100
          example: 200 g

    SavedRecipe:
      type: object
      properties:
        user_id:
          type: integer
        recipe_id:
          type: integer
        created_at:
          type: string
          format: date-time

    SavedRecipeInput:
      type: object
      required: [user_id, recipe_id]
      additionalProperties: false
      properties:
        user_id:
          type: integer
          minimum: 1
        recipe_id:
          type: integer
          minimum: 1

    MealPlan:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    MealPlanInput:
      type: object
      required: [user_id, name, start_date, end_date]
      additionalProperties: false
      properties:
        user_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
          maxLength: 150
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          description: Must not be earlier than start_date.

    MealPlanItem:
      type: object
      properties:
        id:
          type: integer
        meal_plan_id:
          type: integer
        recipe_id:
          type: integer
        planned_date:
          type: string
          format: date
        meal_type:
          type: string
          enum: [breakfast, lunch, dinner, snack]

    MealPlanItemInput:
      type: object
      required: [meal_plan_id, recipe_id, planned_date, meal_type]
      additionalProperties: false
      properties:
        meal_plan_id:
          type: integer
          minimum: 1
        recipe_id:
          type: integer
          minimum: 1
        planned_date:
          type: string
          format: date
        meal_type:
          type: string
          enum: [breakfast, lunch, dinner, snack]