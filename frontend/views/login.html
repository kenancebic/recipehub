<section class="page-header">
    <div class="container">
        <span class="hero-label">Welcome back</span>
        <h1>Log in to RecipeHub</h1>
        <p>Access your saved recipes and continue planning your meals.</p>
    </div>
</section>

<section class="content-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="form-card">
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="login-email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="login-email"
                                   placeholder="you@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="login-password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="login-password"
                                   placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Log In</button>

                        <div id="login-message" class="mt-3" aria-live="polite"></div>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        Don't have an account?
                        <a href="#register" class="text-success fw-bold">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
