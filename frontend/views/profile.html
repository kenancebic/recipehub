<section class="page-header">
    <div class="container">
        <span class="hero-label">Your personal space</span>
        <h1>My Profile</h1>
        <p>Manage your account information and keep your cooking preferences organized.</p>
    </div>
</section>

<section class="content-section">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="content-card text-center h-100">
                    <div class="profile-avatar">👨‍🍳</div>
                    <h2 class="h3">RecipeHub Member</h2>
                    <p class="text-muted">Home Cook</p>
                    <span class="recipe-category">Free Account</span>
                    <hr>
                    <p class="text-muted small mb-0">
                        Your profile will display your account information after registration and login are connected.
                    </p>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="form-card">
                    <h2 class="h3 mb-4">Account Information</h2>

                    <form id="profile-form">
                        <div class="mb-3">
                            <label for="profile-name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="profile-name"
                                   placeholder="Enter your full name">
                        </div>

                        <div class="mb-3">
                            <label for="profile-email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="profile-email"
                                   placeholder="you@example.com">
                        </div>

                        <div class="mb-3">
                            <label for="profile-preferences" class="form-label">Cooking Preferences</label>
                            <select class="form-select" id="profile-preferences">
                                <option value="">Select your preference</option>
                                <option value="vegetarian">Vegetarian</option>
                                <option value="vegan">Vegan</option>
                                <option value="healthy">Healthy Meals</option>
                                <option value="quick">Quick and Easy Meals</option>
                                <option value="all">All Types of Food</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="profile-bio" class="form-label">About Me</label>
                            <textarea class="form-control" id="profile-bio" rows="3"
                                      placeholder="Tell us about your cooking interests"></textarea>
                        </div>

                        <button type="submit" class="btn btn-success">Save Changes</button>
                        <div id="profile-message" class="mt-3" aria-live="polite"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
