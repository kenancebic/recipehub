<section class="page-header">
    <div class="container">
        <span class="hero-label">Join our community</span>
        <h1>Create Your Account</h1>
        <p>Join RecipeHub to save your favorite recipes and organize your meals.</p>
    </div>
</section>

<section class="content-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="form-card">
                    <form id="register-form">
                        <div class="mb-3">
                            <label for="register-name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="register-name"
                                   placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="register-email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="register-email"
                                   placeholder="you@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="register-password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="register-password"
                                   placeholder="Create a password" minlength="8" required>
                            <small class="text-muted">Use at least 8 characters.</small>
                        </div>

                        <div class="mb-4">
                            <label for="register-confirm-password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="register-confirm-password"
                                   placeholder="Repeat your password" minlength="8" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Create Account</button>

                        <div id="register-message" class="mt-3" aria-live="polite"></div>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        Already have an account?
                        <a href="#login" class="text-success fw-bold">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
